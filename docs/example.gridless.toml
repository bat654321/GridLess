# GridLess router settings. Put next to the board as <board>.gridless.toml
# (picked up automatically) or pass with --config. Everything is optional:
# defaults come from the KiCad project (net classes, design rules).

# ---- general (plain keys go before the first [table])
# keep_existing = false    # true: keep routed tracks, add only what is missing
# trust_pours = true       # SMD pads of plane nets inside a same-net pour need no via
# pour_keepout = 0.45       # mm around a pad the pour must reach: signals pay extra there
#                          # so they cannot cut the pour away from the pad (0 = off)
# iterations = 40          # negotiation iterations of the topological router
# order = "logic"          # knots of short links first, then power, then the rest;
#                          # also "width", "cost", "short", "auto"
# short_link = 3.0         # mm: a "short" same-layer link
# terrain = 1.5            # contour map: cost of climbing over foreign copper (0 = off)
# terrain_sigma = 0.5      # mm: fall-off of a hill beyond the clearance band
# terrain_via = 2.0        # mm per unit of height at a via site
# pad_exit = true          # leave rectangular pads at 90 degrees to the edge
# length_reserve = "auto"  # room for length-matching meanders kept free already in the
#                          # topology (as in TopoR): "auto" = only when plain routing leaves
#                          # a length group short, "always", or "off"

# ---- layers: role (signal | plane | off), preferred direction, cost
[layers."F.Cu"]
direction = "horizontal"   # horizontal | vertical | any
direction_weight = 1.0     # extra cost per unit of off-direction travel
[layers."In1.Cu"]
role = "plane"             # inner layers mostly covered by zones are planes by default
[layers."In2.Cu"]
direction = "vertical"
[layers."B.Cu"]
direction = "vertical"
cost = 1.2                 # >1 discourages the layer

# ---- vias (default: Default net class)
[via]
diameter = 0.5
drill = 0.3
cost = 12.0                # how many mm of track one via is worth

# ---- per-net rules (glob patterns); later entries override earlier ones
[[nets]]
match = ["+5", "3V3", "3V7", "VBUS*"]
width = 0.8                # auto neck-down where there is no room
[[nets]]
match = ["TEST*"]
skip = true                # do not route
[[nets]]
match = ["CLK*"]
priority = 5               # route earlier

# ---- differential pairs (also detected automatically from _P/_N, +/-, P/N)
[[diff_pairs]]
p = "USB_P"
n = "USB_N"
width = 0.2
gap = 0.15
max_skew = 0.1

# ---- length matching groups
[[length_groups]]
match = ["DDR_DQ*"]
tolerance = 0.5            # mm
# target = 25.0            # default: the longest member

# ---- gap equalisation (final post-processing step, on by default)
# Tracks between two pads run in the middle; several tracks get equal gaps, each gap
# at least its own clearance rule. The "radar" fades the pull with the copper-to-copper
# distance between the pads. Channel = Default class track width + 2 x clearance.
[centering]
enabled = true
full = 1.3                 # mm: exactly equal gaps up to this pad distance (default 2 channels)
range = 3.25               # mm: no pull from this pad distance on (default 5 channels)
