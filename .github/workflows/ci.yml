name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  python:
    name: Plugin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate translations
        run: python kicad_plugin/check_i18n.py
      - name: Test language detection
        run: python kicad_plugin/test_i18n.py
      - name: Compile plugin sources
        run: python -m py_compile kicad_plugin/common/*.py kicad_plugin/ipc/*.py kicad_plugin/swig/gridless_swig/*.py kicad_plugin/install.py kicad_plugin/pcm/build_pcm.py
