[package]
name = "gridless-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gridless"
path = "src/main.rs"

[dependencies]
gridless = { path = "../gridless" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde_json = "1"
